url: https://ehaarv01.github.io
baseurl: /college-basketball
timezone: America/New_York
markdown: kramdown
kramdown:
  input: GFM
future: true
collections:
  articles:
    output: true
    permalink: /articles/:name/
  rankings:
    output: true
    permalink: /rankings/:name/
defaults:
- scope:
    path: ''
    type: articles
  values:
    layout: article
    published: false
- scope:
    path: ''
    type: rankings
  values:
    layout: ranking
    published: false
exclude:
- README.md
- START-HERE.txt
- index (1).html
- Gemfile
- Gemfile.lock
- vendor
- node_modules
