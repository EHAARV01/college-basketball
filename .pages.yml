media:
  input: assets/uploads
  output: /college-basketball/assets/uploads
  rename: safe
  categories:
  - image
content:
- name: homepage
  label: Homepage
  type: file
  path: _data/homepage.yml
  format: yaml
  fields:
  - name: hero_eyebrow
    label: Featured story label
    type: string
    description: The newest published original article supplies the headline, introduction, and link automatically.
  - name: hero_button
    label: Featured story button
    type: string
  - name: hero_image
    label: Permanent homepage photo
    type: image
    description: Independent of article covers. This photo stays on the homepage until you replace it
      here.
  - name: hero_image_alt
    label: Homepage photo description
    type: string
  - name: hero_image_caption
    label: Homepage photo caption
    type: string
  - name: hero_image_credit
    label: Homepage photo credit
    type: string
  - name: latest_heading
    label: Latest heading
    type: string
  - name: archive_label
    label: Archive label
    type: string
  - name: rankings_heading
    label: Rankings heading
    type: string
  - name: rankings_intro
    label: Rankings intro
    type: text
    description: Shown until your first published article in the Rankings category.
  - name: about_heading
    label: About heading
    type: string
  - name: about_body
    label: About body
    type: rich-text
    options:
      format: markdown
      switcher: false
  - name: about_note
    label: About note
    type: text
  - name: articles_heading
    label: Articles heading
    type: string
  - name: articles_intro
    label: Articles intro
    type: text
  - name: empty_articles_message
    label: Empty articles message
    type: text
- name: publication
  label: Publication settings
  type: file
  path: _data/publication.yml
  format: yaml
  fields:
  - name: name
    label: Publication name
    type: string
    required: true
  - name: logo_letter
    label: Logo letter
    type: string
    options:
      maxlength: 1
  - name: tagline
    label: Tagline
    type: string
  - name: season
    label: Season
    type: string
  - name: strapline
    label: Top banner wording
    type: string
  - name: edition_label
    label: Edition label
    type: string
  - name: author
    label: Default author
    type: string
  - name: description
    label: Search description
    type: text
  - name: nav
    label: Navigation labels
    type: object
    fields:
    - name: home
      label: Home
      type: string
    - name: latest
      label: Latest
      type: string
    - name: rankings
      label: Rankings
      type: string
    - name: analysis
      label: Analysis
      type: string
    - name: about
      label: About
      type: string
  - name: footer_description
    label: Footer description
    type: string
  - name: editor_label
    label: Editor link wording
    type: string
- name: articles
  label: Articles
  type: collection
  path: _articles
  format: yaml-frontmatter
  filename:
    template: '{primary}.md'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - category
    - published
    - date
    primary: title
    sort:
    - date
    - title
    search:
    - title
    - category
    - summary
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Headline
    type: string
    required: true
  - name: date
    label: Publication date
    type: date
    required: true
    options:
      format: yyyy-MM-dd
    description: Date shown to readers. This does not schedule publication.
  - name: author
    label: Author
    type: string
    default: Ethan Aarvig
  - name: category
    label: Category
    type: select
    required: true
    default: Predictions
    options:
      values:
      - Predictions
      - Game Analysis
      - Features & Opinion
      - Rankings
      - AP Top 25
  - name: summary
    label: Short introduction
    type: text
    required: true
    description: Shown on the homepage, article cards, and above the article.
  - name: published
    label: Published
    type: boolean
    default: false
    description: Turn on and save to show this article on the website. Turn off to remove it from the
      website. The GitHub repository itself is public.
  - name: image
    label: Cover image
    type: image
  - name: image_alt
    label: Image description
    type: string
  - name: image_caption
    label: Image caption and credit
    type: string
  - name: body
    label: Article
    type: rich-text
    required: true
    options:
      format: markdown
      switcher: false
    description: Write your article here. For game recaps, use this for the introduction and add each
      game below. For rankings, use this for your commentary; add teams under Weekly rankings.
  - name: games
    label: Game score banners
    type: object
    description: Optional. Add one entry per game, in reading order. Each banner appears after the article
      introduction and before its own analysis.
    list:
      collapsible:
        collapsed: true
        summary: '{team_a} vs {team_b}'
    fields:
    - name: team_a
      label: First team
      type: string
      required: true
    - name: score_a
      label: First team score
      type: number
      required: true
    - name: logo_a
      label: First team logo (optional)
      type: image
      description: Known team names get a logo automatically. Upload here only to override it or add a
        new team.
    - name: color_a
      label: First team color
      type: select
      default: Navy
      options:
        values:
        - Navy
        - Blue
        - Light blue
        - Green
        - Red
        - Orange
        - Gold
        - Purple
        - Black
    - name: team_b
      label: Second team
      type: string
      required: true
    - name: score_b
      label: Second team score
      type: number
      required: true
    - name: logo_b
      label: Second team logo (optional)
      type: image
      description: Known team names get a logo automatically. Upload here only to override it or add a
        new team.
    - name: color_b
      label: Second team color
      type: select
      default: Navy
      options:
        values:
        - Navy
        - Blue
        - Light blue
        - Green
        - Red
        - Orange
        - Gold
        - Purple
        - Black
    - name: status
      label: Result label
      type: string
      default: Final
      description: 'For example: Final, Final / OT, or Final / 2OT.'
    - name: note
      label: Game note (optional)
      type: string
      description: 'For example: Las Vegas or Eternal City Tip-Off.'
    - name: takeaway
      label: Key takeaway (optional)
      type: text
      description: Your one-sentence verdict. Shown in a highlighted box above this game’s analysis.
    - name: analysis
      label: Analysis for this game
      type: rich-text
      options:
        format: markdown
        switcher: false
  - name: watch_next
    label: What I’m watching next (optional)
    type: rich-text
    options:
      format: markdown
      switcher: false
    description: Appears in a separate box at the end of the article. Leave blank to omit it.
  - name: ranking_label
    label: Ranking edition / week (rankings only)
    type: string
    description: 'For example: Preseason, Week 8, or Week 14. Create a separate article for each week
      so older editions stay available.'
  - name: ranking_source
    label: Poll source label (optional)
    type: string
    description: 'For example: Texas Athletics — full AP poll.'
  - name: ranking_source_url
    label: Poll source link (optional)
    type: string
  - name: ranking_rows
    label: Weekly rankings (rankings only)
    type: object
    description: 'For Rankings or AP Top 25 articles. Add teams in rank order: the first team is No. 1.
      Drag to reorder. Leave blank for other articles. Records and previous ranks must be from this edition,
      not today.'
    list:
      max: 25
      collapsible:
        collapsed: true
        summary: '{team}'
    fields:
    - name: team
      label: Team
      type: string
      required: true
      description: Use the usual team name, such as Duke or Michigan State. Known teams get logos automatically.
    - name: logo
      label: Team logo override (optional)
      type: image
    - name: record
      label: Record at release (optional)
      type: string
      description: 'For example: 18-3. Leave blank if not supplied by the source.'
    - name: previous_rank
      label: Rank in previous edition (optional)
      type: number
      description: Leave blank for preseason or when unavailable. Movement is calculated from this number.
    - name: new_entry
      label: New to this Top 25
      type: boolean
      default: false
      description: Turn on for a newly ranked team. Takes priority over previous rank.
    - name: points
      label: AP poll points (AP only)
      type: number
    - name: first_place_votes
      label: AP first-place votes (AP only)
      type: number
