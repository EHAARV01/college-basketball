media:
  input: assets/uploads
  output: /college-basketball/assets/uploads
  rename: safe
  categories:
  - image
content:
- name: homepage
  label: Homepage
  type: file
  path: _data/homepage.yml
  format: yaml
  fields:
  - name: hero_eyebrow
    label: Featured story label
    type: string
    description: The newest published original article supplies the headline, introduction, and link automatically.
  - name: hero_button
    label: Featured story button
    type: string
  - name: hero_image
    label: Fallback homepage photo
    type: image
    description: Used when the featured article has no cover image. Its caption is displayed so it is
      not mistaken for a photo of that game.
  - name: hero_image_alt
    label: Fallback photo photo description
    type: string
  - name: hero_image_caption
    label: Fallback photo photo caption
    type: string
  - name: hero_image_credit
    label: Fallback photo photo credit
    type: string
  - name: latest_heading
    label: Latest heading
    type: string
  - name: archive_label
    label: Archive label
    type: string
  - name: rankings_heading
    label: Rankings heading
    type: string
  - name: rankings_intro
    label: Rankings intro
    type: text
    description: Shown until your first published article in the Rankings category.
  - name: about_heading
    label: About heading
    type: string
  - name: about_body
    label: About body
    type: rich-text
    options:
      format: markdown
      switcher: false
  - name: about_note
    label: About note
    type: text
  - name: articles_heading
    label: Articles heading
    type: string
  - name: articles_intro
    label: Articles intro
    type: text
  - name: empty_articles_message
    label: Empty articles message
    type: text
- name: publication
  label: Publication settings
  type: file
  path: _data/publication.yml
  format: yaml
  fields:
  - name: name
    label: Publication name
    type: string
    required: true
  - name: logo_letter
    label: Logo letter
    type: string
    options:
      maxlength: 1
  - name: tagline
    label: Tagline
    type: string
  - name: season
    label: Season
    type: string
  - name: strapline
    label: Top banner wording
    type: string
  - name: edition_label
    label: Edition label
    type: string
  - name: author
    label: Default author
    type: string
  - name: description
    label: Search description
    type: text
  - name: nav
    label: Navigation labels
    type: object
    fields:
    - name: home
      label: Home
      type: string
    - name: latest
      label: Latest
      type: string
    - name: rankings
      label: Rankings
      type: string
    - name: analysis
      label: Analysis
      type: string
    - name: about
      label: About
      type: string
  - name: footer_description
    label: Footer description
    type: string
  - name: editor_label
    label: Editor link wording
    type: string
- name: articles
  label: Articles
  type: collection
  path: _articles
  format: yaml-frontmatter
  filename:
    template: '{primary}.md'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - category
    - published
    - date
    primary: title
    sort:
    - date
    - title
    search:
    - title
    - category
    - summary
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Headline
    type: string
    required: true
  - name: date
    label: Publication date
    type: date
    required: true
    options:
      format: yyyy-MM-dd
    description: Date shown to readers. This does not schedule publication.
  - name: author
    label: Author
    type: string
    default: Ethan Aarvig
  - name: category
    label: Category
    type: select
    required: true
    default: Predictions
    options:
      values:
      - Predictions
      - Game Analysis
      - Features & Opinion
      - Rankings
      - AP Top 25
  - name: summary
    label: Short introduction
    type: text
    required: true
    description: Shown on the homepage, article cards, and above the article.
  - name: published
    label: Published
    type: boolean
    default: false
    description: Turn on and save to show this article on the website. Turn off to remove it from the
      website. The GitHub repository itself is public.
  - name: image
    label: Cover image
    type: image
  - name: image_alt
    label: Image description
    type: string
  - name: image_caption
    label: Image caption and credit
    type: string
  - name: body
    label: Article
    type: rich-text
    required: true
    options:
      format: markdown
      switcher: false
    description: Write the introduction here. For game breakdowns with score banners, use Game score banners
      below; each game has its own analysis field.
  - name: games
    label: Game score banners
    type: object
    description: Optional. Add one entry per game, in reading order. Each banner appears after the article
      introduction and before its own analysis.
    list:
      collapsible:
        collapsed: true
        summary: '{team_a} vs {team_b}'
    fields:
    - name: team_a
      label: First team
      type: string
      required: true
    - name: score_a
      label: First team score
      type: number
      required: true
    - name: logo_a
      label: First team logo (optional)
      type: image
    - name: color_a
      label: First team color
      type: select
      default: Navy
      options:
        values: &id001
        - Navy
        - Blue
        - Light blue
        - Green
        - Red
        - Orange
        - Gold
        - Purple
        - Black
    - name: team_b
      label: Second team
      type: string
      required: true
    - name: score_b
      label: Second team score
      type: number
      required: true
    - name: logo_b
      label: Second team logo (optional)
      type: image
    - name: color_b
      label: Second team color
      type: select
      default: Navy
      options:
        values: *id001
    - name: status
      label: Result label
      type: string
      default: Final
      description: 'For example: Final, Final / OT, or Final / 2OT.'
    - name: note
      label: Game note (optional)
      type: string
      description: 'For example: Las Vegas or Eternal City Tip-Off.'
    - name: analysis
      label: Analysis for this game
      type: rich-text
      options:
        format: markdown
        switcher: false
